version: "3.9"

services:
  frontend:
    build: ./furniture
    ports:
      - "3000:80"
    depends_on:
      - user-service

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "3001:3001"
    env_file:
      - ./.env
    volumes:
      - ./config:/app/config

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "3002:3002"
    env_file:
      - ./.env
    volumes:
      - ./config:/app/config

  cart-service:
    build: ./cart-service
    container_name: cart-service
    ports:
      - "3003:3003"
    env_file:
      - ./.env
    volumes:
      - ./config:/app/config

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "3004:3004"
    env_file:
      - ./.env
    volumes:
      - ./config:/app/config

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  # Workers
  outbox-publisher:
    build:
      context: ./workers
    command: node outbox-publisher.js
    depends_on:
      - rabbitmq
      - order-service
    env_file:
      - ./.env
    volumes:
      - ./config:/app/config

  inventory-consumer:
    build:
      context: ./workers
    command: node inventory-subscriber.js
    depends_on:
      - rabbitmq
      - order-service
    env_file:
      - ./.env
    volumes:
      - ./config:/app/config
